<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传文件 - 实习成长记录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf8f5;
            --surface: #ffffff;
            --text: #2c2c2c;
            --text-muted: #8a8a8a;
            --accent: #e8590c;
            --accent-soft: #fff4e6;
            --border: #eee8e0;
            --radius: 12px;
            --font-serif: 'Noto Serif SC', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-serif);
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 60px 24px; }
        header { margin-bottom: 40px; }
        header h1 { font-size: 1.6rem; font-weight: 700; }
        header a { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; }
        header a:hover { color: var(--accent); }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 60px 40px;
            text-align: center;
            background: var(--surface);
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .upload-zone .icon { font-size: 3rem; margin-bottom: 16px; }
        .upload-zone p { color: var(--text-muted); font-size: 0.9rem; }
        .upload-zone .hint { font-size: 0.78rem; margin-top: 8px; }

        .file-list {
            margin-top: 24px;
            list-style: none;
        }

        .file-list li {
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-list .size { color: var(--text-muted); font-size: 0.78rem; }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--accent);
            color: white;
            border-radius: 20px;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: var(--font-serif);
            transition: opacity 0.2s;
            margin-top: 24px;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/">← 返回首页</a>
            <h1 style="margin-top: 16px;">上传学习文件</h1>
        </header>

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="icon">📄</div>
                <p>点击选择文件，或拖拽文件到这里</p>
                <p class="hint">支持 PDF、Word、Markdown、PPT 等文档格式，单文件最大 50MB</p>
            </div>
            <input type="file" id="fileInput" name="files" multiple>

            <ul class="file-list" id="fileList"></ul>

            <button type="submit" class="btn" id="submitBtn" disabled>上传文件</button>
        </form>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');

        fileInput.addEventListener('change', updateFileList);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFileList();
        });

        function updateFileList() {
            fileList.innerHTML = '';
            const files = fileInput.files;
            if (files.length > 0) {
                submitBtn.disabled = false;
                for (const f of files) {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${f.name}</span><span class="size">${(f.size/1024).toFixed(1)} KB</span>`;
                    fileList.appendChild(li);
                }
            } else {
                submitBtn.disabled = true;
            }
        }
    </script>
</body>
</html>
